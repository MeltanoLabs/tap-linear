version: 1
plugins:
  extractors:
  - name: tap-linear
    namespace: tap_linear
    pip_url: -e .
    executable: tap-linear
    description: Singer tap for Linear, built with the Meltano SDK
    capabilities:
    - catalog
    - discover
    - state
    settings:
    - name: auth_token
      kind: password
      label: Authentication Token
      description: Linear API authentication token
    - name: start_date
      kind: date_iso8601
      label: Start Date
      description: The earliest record date to sync
    - name: api_url
      kind: string
      label: API URL
      description: The Linear GraphQL API endpoint
